  <p class="note">ファンが作った非公式の手帳です。ナツさん本人のSNSと、イイトコドリ・みんなtoお友だちの公式X(グループの告知)をもとに、月でも落ちてこない限り基本毎日、手作業で更新しています。最新の情報はそれぞれの公式発表でご確認ください。<br>最終更新 <span id="upd"></span></p>
  <div class="sns">
    <a href="https://x.com/asano_72" target="_blank" rel="noopener">ナツさんのX</a>
    <a href="https://www.instagram.com/asano_72/" target="_blank" rel="noopener">ナツさんのInstagram</a>
    <a href="https://x.com/itoko_staff" target="_blank" rel="noopener">イイトコドリ(イトコ)のX</a>
    <a href="https://x.com/minnato_friends" target="_blank" rel="noopener">みんなtoお友だちのX</a>
    <a href="https://timetr.ee/p/asano_72" target="_blank" rel="noopener">ナツさんのカレンダー(TimeTree)</a>
  </div>
  <div class="filters" id="filters" role="group" aria-label="種類で絞り込み"></div>
  <div id="list"></div>
  <details class="pastbox" id="pastbox"><summary id="pastsum">これまでの活動</summary><div id="past"></div></details>
</div>
<button type="button" class="add" id="addBtn" hidden>＋ 予定を追加</button>
<div class="status" id="status" role="status"></div>
<dialog id="dlg">
  <form id="form">
    <h2 id="formTitle">予定を追加</h2>
    <div class="row">
      <label>日付<input type="date" name="date" id="f-date" required></label>
      <label>種類<select name="type" id="f-type"><option value="live">ライブ</option><option value="photo">撮影会</option><option value="cheki">チェキ会</option><option value="web">チェキ屋</option><option value="visit">パチンコ</option><option value="event">オフ会</option><option value="release">リリイベ</option><option value="special">1日店長</option></select></label>
    </div>
    <div class="row">
      <label>開場・集合<input type="time" name="open" id="f-open"></label>
      <label>開演・開始<input type="time" name="start" id="f-start"></label>
    </div>
    <label>タイトル<input type="text" name="title" id="f-title" placeholder="例:クリームセッション撮影会"></label>
    <label>会場<input type="text" name="venue" id="f-venue" placeholder="例:秋葉原Gスタ"></label>
    <div class="row">
      <label>料金<input type="text" name="price" id="f-price" placeholder="例:前売3,000円"></label>
      <label>URL<input type="url" name="url" id="f-url" placeholder="https://"></label>
    </div>
    <label>メモ(特典・販売開始日など)<textarea name="memo" id="f-memo"></textarea></label>
    <div class="confirm" id="delConfirm" hidden>もう一度「削除」を押すと消えます</div>
    <div class="actions">
      <button type="button" class="del" id="delBtn" hidden>削除</button>
      <button type="button" id="cancelBtn">やめる</button>
      <button type="submit" class="save">保存する</button>
    </div>
  </form>
</dialog>
</script>
<div id="root"></div>
<script id="app">
(function(){
  var state; try { state = JSON.parse(document.getElementById('state').textContent); } catch(e) { state = {items:[]}; }
  if (!Array.isArray(state.items)) state.items = [];
  var CSS = document.getElementById('css').textContent;
  var APP = document.getElementById('app').textContent;
  var BODY_TPL = document.getElementById('bodytpl').textContent;
  document.getElementById('root').innerHTML = BODY_TPL;
  try { if (new Date().getMonth()===9) { document.querySelector('.girl').classList.add('halloween'); document.querySelector('header.hd').classList.add('halloween'); } } catch(e){}
  var TYPES = {live:'ライブ',photo:'撮影会',web:'チェキ屋',visit:'パチンコ',cheki:'チェキ会',event:'オフ会',release:'リリイベ',special:'1日店長'};
  var filter = 'all', editingId = null, artifactApi = null, canEditPage = false, delArmed = false;
  try { filter = localStorage.getItem('natsu-filter') || 'all'; } catch(e){}
  if (filter!=='all' && !TYPES[filter]) filter='all';

  var W = ['日','月','火','水','木','金','土'];
  function pad(n){ return String(n).padStart(2,'0'); }
  function todayStr(){ var d=new Date(); return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate()); }
  function daysUntil(ds){ return Math.round((new Date(ds+'T00:00:00')-new Date(todayStr()+'T00:00:00'))/86400000); }
  function fmtJ(ds){ var d=new Date(ds+'T00:00:00'); return (d.getMonth()+1)+'月'+d.getDate()+'日('+W[d.getDay()]+')'; }
  function esc(s){ return String(s||'').replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
  function safeUrl(u){ return /^https?:\/\//i.test(u||'') ? u : ''; }

  function card(l, past){
    var d = new Date(l.date+'T00:00:00'), w = d.getDay(), n = daysUntil(l.date);
    var t = TYPES[l.type] ? l.type : 'event';
    var soon = !past ? (n===0?'今日!':n===1?'明日!':'あと'+n+'日') : '';
    var times = [l.open?'開場 '+esc(l.open):'', l.start?'開演 '+esc(l.start):''].filter(Boolean).join(' / ');
    var u = safeUrl(l.url);
    var link = u ? '<div class="tlink" data-link><a href="'+esc(u)+'" target="_blank" rel="noopener">詳細・チケットページを開く</a><span class="turl">'+esc(u)+'</span><button type="button" class="copy" data-copy="'+esc(u)+'">リンクをコピー</button></div>' : '';
    var mq = (l.venue||'').trim();
    var map = mq ? '<div class="maplink" data-link><a href="https://www.google.com/maps/search/?api=1&amp;query='+encodeURIComponent(mq)+'" target="_blank" rel="noopener">📍 会場の地図を開く</a></div>' : '';
    return '<div class="live'+(past?' past':'')+(canEditPage?' editable':'')+'" style="--c:var(--'+t+')"'+(canEditPage?' role="button" tabindex="0"':'')+' data-id="'+esc(l.id)+'">'+
      '<div class="stub"><span class="m">'+(d.getMonth()+1)+'月</span><span class="d">'+d.getDate()+'</span><span class="w'+(w===0?' sun':w===6?' sat':'')+'">'+W[w]+'</span></div>'+
      '<div class="body">'+(soon?'<div class="soon">'+soon+'</div>':'')+
      '<div class="title">'+esc(l.title||'(タイトル未入力)')+'</div>'+
      ([esc(l.venue),times].filter(Boolean).length?'<div class="meta">'+[esc(l.venue),times].filter(Boolean).join(' / ')+'</div>':'')+
      '<div class="chips"><span class="chip">'+TYPES[t]+'</span>'+(l.group?'<span class="chip grp">'+esc(l.group)+'</span>':'')+(l.area?'<span class="chip area">'+esc(l.area)+'</span>':'')+(l.price?'<span class="chip ticket">'+esc(l.price)+'</span>':'')+'</div>'+
      map + link + (l.memo?'<div class="meta">'+esc(l.memo)+'</div>':'') +'</div></div>';
  }

  var OCCASIONAL = ['cheki','event','release','special'];
  function render(){
    var t = todayStr();
    document.getElementById('upd').textContent = state.updated ? fmtJ(state.updated) : '';
    var all = state.items.slice().sort(function(a,b){ return (a.date+(a.start||'')).localeCompare(b.date+(b.start||'')); });
    var upTypes = {}; all.forEach(function(l){ if (l.date >= t) upTypes[l.type]=true; });
    if (filter!=='all' && OCCASIONAL.indexOf(filter)>=0 && !upTypes[filter]) filter='all';
    document.querySelectorAll('#filters button').forEach(function(x){ var k=x.dataset.f; x.hidden = OCCASIONAL.indexOf(k)>=0 && !upTypes[k]; });
    var f = all.filter(function(l){ return filter==='all' || l.type===filter; });
    var up = f.filter(function(l){ return l.date >= t; });
    var past = f.filter(function(l){ return l.date < t; }).reverse();
    document.getElementById('list').innerHTML = up.length ? up.map(function(l){return card(l,false);}).join('') :
      '<div class="empty">'+(filter==='web'?'いま受付中のチェキ屋さんはありません。<br>毎月の告知が出たら追加します🛒':state.items.length?'この種類の予定はまだありません':'まだ予定が入っていません')+'</div>';
    document.getElementById('past').innerHTML = past.map(function(l){return card(l,true);}).join('');
    document.getElementById('pastbox').hidden = past.length===0;
    var since = all.length ? new Date(all[0].date+'T00:00:00') : null;
    document.getElementById('pastsum').textContent = 'これまでの活動('+past.length+'件)'+(since?' '+since.getFullYear()+'年'+(since.getMonth()+1)+'月'+since.getDate()+'日から記録':'');
    document.querySelectorAll('#filters button').forEach(function(x){ x.setAttribute('aria-pressed', x.dataset.f===filter?'true':'false'); });
  }

  var fl = document.getElementById('filters');
  fl.innerHTML = [['all','すべて']].concat(Object.keys(TYPES).map(function(k){return [k,TYPES[k]];})).map(function(p){
    return '<button type="button" data-f="'+p[0]+'" id="flt-'+p[0]+'">'+p[1]+'</button>'; }).join('');
  fl.addEventListener('click', function(e){ var b=e.target.closest('button'); if(!b) return; filter=b.dataset.f;
    try{ localStorage.setItem('natsu-filter',filter); }catch(e){} render(); });

  var statusEl = document.getElementById('status'), st;
  function toast(msg){ statusEl.textContent = msg; statusEl.classList.add('show'); clearTimeout(st); st=setTimeout(function(){statusEl.classList.remove('show');},2600); }

  var RESET = ':root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}';
  function buildDoc(){
    var json = JSON.stringify(state).replace(/</g,'\\u003c');
    return '<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>'+RESET+'</style></head><body>'+
      '<title>朝野ナツ 活動手帳</title>\n<link rel="preconnect" href="https://fonts.googleapis.com">\n'+
      '<link href="https://fonts.googleapis.com/css2?family=M+PLUS+Rounded+1c:wght@500;800&family=Zen+Kaku+Gothic+New:wght@400;700&display=swap" rel="stylesheet">\n'+
      '<style id="css">'+CSS+'</style>\n'+
      '<script type="application/json" id="state">'+json+'<\/script>\n'+
      '<script type="text/html" id="bodytpl">'+BODY_TPL+'<\/script>\n<div id="root"></div>\n'+
      '<script id="app">'+APP+'<\/script>\n</body></html>';
  }
  function persist(){
    if (!artifactApi){ toast('この画面では保存できません'); return; }
    state.updated = todayStr();
    toast('保存しています…');
    artifactApi.publish(buildDoc()).then(function(){ toast('保存しました'); }).catch(function(err){
      var c = err && err.code;
      if (c==='conflict') toast('別の画面で更新されたため、最新の内容を読み込みます');
      else if (c==='not_writer' || c==='not_granted') toast('この画面は閲覧専用です');
      else if (c==='rate_limited') toast('保存が混み合っています。少し待ってからもう一度保存してください');
      else toast('保存に失敗しました。もう一度お試しください');
    });
  }

  var dlg = document.getElementById('dlg'), form = document.getElementById('form');
  function openForm(l){
    editingId = l ? l.id : null; delArmed = false;
    document.getElementById('delConfirm').hidden = true;
    document.getElementById('formTitle').textContent = l ? '予定を編集' : '予定を追加';
    document.getElementById('delBtn').hidden = !l;
    form.reset();
    if (l) ['date','type','open','start','title','venue','price','url','memo'].forEach(function(k){ form.elements[k].value = l[k]||''; });
    if (dlg.showModal) dlg.showModal(); else dlg.setAttribute('open','');
  }
  function closeForm(){ if (dlg.close) dlg.close(); else dlg.removeAttribute('open'); }
  document.getElementById('addBtn').addEventListener('click', function(){ openForm(null); });
  document.getElementById('cancelBtn').addEventListener('click', closeForm);
  document.getElementById('delBtn').addEventListener('click', function(){
    if (!editingId) return;
    if (!delArmed){ delArmed = true; document.getElementById('delConfirm').hidden = false; return; }
    state.items = state.items.filter(function(l){ return l.id!==editingId; });
    closeForm(); render(); persist();
  });
  form.addEventListener('submit', function(e){
    e.preventDefault();
    var E = form.elements;
    if (!E.date.value){ E.date.focus(); return; }
    var rec = { id: editingId || ('n'+Date.now().toString(36)), type:E.type.value, date:E.date.value, open:E.open.value, start:E.start.value,
      title:E.title.value.trim(), venue:E.venue.value.trim(), price:E.price.value.trim(), url:E.url.value.trim(), memo:E.memo.value.trim() };
    if (editingId) state.items = state.items.map(function(l){ return l.id===editingId?rec:l; });
    else state.items.push(rec);
    closeForm(); render(); persist();
  });

  function copyText(t){
    function fallback(){
      var ta=document.createElement('textarea'); ta.value=t; ta.setAttribute('readonly',''); ta.style.position='fixed'; ta.style.opacity='0';
      document.body.appendChild(ta); ta.select(); ta.setSelectionRange(0,t.length);
      var ok=false; try{ ok=document.execCommand('copy'); }catch(e){}
      document.body.removeChild(ta);
      toast(ok?'リンクをコピーしました':'コピーできませんでした。URLを長押しして選んでください');
    }
    try{ if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t).then(function(){ toast('リンクをコピーしました'); }, fallback); else fallback(); }catch(e){ fallback(); }
  }
  function onCard(e){
    var cp = e.target.closest('[data-copy]');
    if (cp){ if (e.type==='click') copyText(cp.getAttribute('data-copy')); return; }
    if (e.target.closest('[data-link]') || !canEditPage) return;
    var c = e.target.closest('.live'); if (!c) return;
    if (e.type==='keydown'){ if (e.key!=='Enter' && e.key!==' ') return; e.preventDefault(); }
    var l = state.items.filter(function(x){return x.id===c.dataset.id;})[0];
    if (l) openForm(l);
  }
  ['list','past'].forEach(function(id){ var el=document.getElementById(id); el.addEventListener('click',onCard); el.addEventListener('keydown',onCard); });

  render();

})();
</script>
